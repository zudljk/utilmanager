services:
  gasverbrauch:
    build: .
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      APP_BASE_PATH: ${APP_BASE_PATH:-}
      APP_USER: ${APP_USER:-admin}
      APP_PASSWORD: ${APP_PASSWORD:?APP_PASSWORD in .env setzen}
      UPLOAD_TOKEN: ${UPLOAD_TOKEN:?UPLOAD_TOKEN in .env setzen}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY in .env setzen}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8000"
    volumes:
      - gas-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s

volumes:
  gas-data:
